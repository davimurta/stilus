services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stilus
      POSTGRES_PASSWORD: stilus
      POSTGRES_DB: stilus_dev
    ports:
      - "54329:5432"
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - stilus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stilus -d stilus_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  stilus-postgres:
